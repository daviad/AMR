# Nav2 参数：AMCL 定位 + NavfnPlanner 全局规划 + DWB 局部控制 + 双层 costmap
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000
    # 实测：轮式 odom 在原地转向时偏航误差 10~25%/圈（车体与轮子转角不一致，
    # 见 odom 标定数据）。更新阈值 0.2m/0.2rad 会让 AMCL 在转向过程中长时间
    # 只用坏 odom 外推，实测表现为转完弯后位姿"跳一下"。降到 0.1/0.1 提高
    # 转向过程的量测修正频率。
    update_min_d: 0.1
    update_min_a: 0.1
    # 旋转过程噪声调大，让粒子云覆盖转向滑移的不确定性（alpha3/alpha4 为
    # 旋转相关分量）。默认 0.2 在 odom 偏航误差 20% 时粒子云过窄，会跟丢。
    alpha1: 0.3
    alpha2: 0.3
    alpha3: 0.4
    alpha4: 0.4
    laser_max_range: 12.0
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    # 机器人固定从 (0,0) 出生，且 amr_start.sh 会再发一次 /initialpose；
    # 显式设置初始位姿，避免 AMCL 重启后无位姿导致重定位场景不可复现。
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 实测问题：DWB 的 xy_goal_tolerance(0.15) 大于 goal_checker 的 0.10，
      # 机器人在离目标 0.10~0.15 m 的"死区"里只原地旋转、不再平移，
      # 20 s 内位移不足 0.3 m 即触发 "Failed to make progress" -> abort -> 重试死循环。
      # 现把进度判定半径降到 0.10（=终点容差，避免死区），超时放宽到 30 s。
      required_movement_radius: 0.10
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # 终点精度收紧：直接服务于"目标点终点误差"判定
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
    # DWB 局部控制器（外面包一层 RotationShim）
    # 实测证据（cmddiag）：当目标在正后方（航向差≈180°）时，DWB 采样在正负角速度之间
    # 左右对称打平，只能输出 ±0.026 rad/s 的抖动，7.4 m 的直线目标 30 s 内 0 位移，
    # 随后被 progress_checker 判死 -> abort -> 重试。这类"正后方目标"必须靠
    # RotationShimController 先原地定向，再交给 DWB 跟踪路径。
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      # 航向差超过 45° 就先原地转到路径朝向；转速 0.4 rad/s（<0.5 上限）
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.0
      # false 时 shim 会在终点反复"转回路径朝向"，与 DWB 的末端定航向争抢，
      # 目标航向与接近方向相反时会卡在 30~60° 直到 progress checker 超时（实测 W7 120 s 失败）；
      # 改 true 只在起步定向一次，末端交给 DWB，W7 复测 43.8 s 成功。
      rotate_to_heading_once: true
      use_path_orientations: false
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      # 速度按扫地机器人量级收窄（要求 0.2–0.3 m/s、ω≤0.5 rad/s），
      # 并把加减速减半，避免瞬起瞬停放大原地转向的轮地滑移。
      max_vel_x: 0.3
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # RotateToGoal 的切换半径必须小于 goal_checker 的 xy_goal_tolerance(0.10)，
      # 否则最后 0.10~0.15 m 只能原地转、永远到不了终点（实测 20 轮全部超时）。
      xy_goal_tolerance: 0.05
      # 原 0.25 相对 max_vel_x=0.3 过大，几乎任意速度都被判为"已停"，
      # RotateToGoal 会提前接管并放弃平移；降到 0.05。
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # 关键：闭环地图四周存在 unknown 环（12m 雷达建图边界外），
      # allow_unknown=true 时 NavFn 会把 unknown 当成可通行（代价 253），
      # 存在"绕过墙端/贴着未知区切角"的规划穿墙风险，改为 false。
      allow_unknown: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 底盘真实 0.40×0.30 m，外接半径 0.25；原 robot_radius=0.22 会让四角
      # 在贴墙时嵌入墙体（RViz 上表现为"贴墙穿模"）。改为真实 footprint
      # 并留 2cm 余量。
      footprint: "[[0.22, 0.17], [-0.22, 0.17], [-0.22, -0.17], [0.22, -0.17]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          obstacle_max_range: 11.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 底盘真实 0.40×0.30 m，外接半径 0.25；原 robot_radius=0.22 会让四角
      # 在贴墙时嵌入墙体（RViz 上表现为"贴墙穿模"）。改为真实 footprint
      # 并留 2cm 余量。
      footprint: "[[0.22, 0.17], [-0.22, 0.17], [-0.22, -0.17], [0.22, -0.17]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          obstacle_max_range: 11.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # 恢复行为也统一到 ≤0.5 rad/s，避免恢复动作把机器人甩出地图
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # 与 DWB/行为树一致的速度包线：0.3 m/s、0.5 rad/s，加减速减半
    max_velocity: [0.3, 0.0, 0.5]
    min_velocity: [-0.3, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ['map_server',
                 'amcl',
                 'controller_server',
                 'planner_server',
                 'behavior_server',
                 'bt_navigator',
                 'velocity_smoother']
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ['map_server', 'amcl']
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    observation_sources: ["scan"]
    polygons: ["safe_circle"]
    safe_circle:
      type: "circle"
      radius: 0.001
      action_type: "none"
      max_points: 1000
    scan:
      type: "scan"
      topic: "/scan"

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_dock"]
    simple_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      v_angular_max: 0.75
      slowdown_radius: 0.25
