# MQTT broker：项目专用，避免与系统 mosquitto 冲突
# TCP 1884（网关/仿真端），WebSocket 9002（仅调试用，App 已改走 HTTP/WS 网关）
#
# 控制面收口（docs/架构-网关收口.md §7）：
#   - allow_anonymous false：匿名客户端连 CONNECT 都过不了
#   - 只有 gateway 账号能 publish amr/cmd/#，只有 robot 账号能写回报/状态
#   - 密码文件由 amr_gateway/scripts/setup_mqtt_auth.sh 生成（mosquitto.passwd 不进 git）
listener 1884 0.0.0.0
listener 9002 0.0.0.0
protocol websockets

allow_anonymous false
password_file /home/dxw/amr/amr_sim_ws/src/amr_comm/config/mosquitto.passwd
acl_file /home/dxw/amr/amr_sim_ws/src/amr_comm/config/mosquitto.acl

# 持久化到内存即可
persistence false
log_dest stdout
log_type error
log_type warning
