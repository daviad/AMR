<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="amr_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>amr_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- HLS 播放支持（Chrome/Edge 无原生 HLS）：hls.js 本地副本 + 自动绑定 -->
  <script src="hls.min.js"></script>
  <script>
    // 扫描带 data-hls 属性的 <video>，自动用 hls.js 绑定播放
    function bindHlsVideos() {
      document.querySelectorAll('video[data-hls]:not([data-hls-bound])').forEach(function (v) {
        v.dataset.hlsBound = '1';
        var src = v.dataset.hls;
        if (window.Hls && Hls.isSupported()) {
          var hls = new Hls({ lowLatencyMode: true });
          hls.loadSource(src);
          hls.attachMedia(v);
        } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src; // Safari 原生支持
        }
      });
    }
    new MutationObserver(bindHlsVideos).observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', bindHlsVideos);
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
