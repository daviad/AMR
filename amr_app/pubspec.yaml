name: amr_app
description: 仿真巡检 AMR Flutter 上位机（rosbridge + MQTT）
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  web_socket_channel: ^3.0.3
  mqtt_client: ^10.2.1
  video_player: ^2.9.2
  fvp: ^0.32.0
  shared_preferences: ^2.3.0
  flutter_webrtc: ^1.6.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
